apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: observability
spec:
  parentRefs:
    - name: chat
      namespace: gateway
      sectionName: https
  hostnames:
    - grafana.chat.localhost
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80
---
