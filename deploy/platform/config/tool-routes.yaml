apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - name: chat
      namespace: gateway
      sectionName: https
  hostnames:
    - argocd.chat.localhost
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
---
