apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: chat-gateway-tls
  namespace: gateway
spec:
  secretName: chat-gateway-tls
  commonName: chat.localhost
  dnsNames:
    - chat.localhost
    - "*.chat.localhost"
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: chat-ca
