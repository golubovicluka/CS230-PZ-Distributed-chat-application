apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: chat
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: chat-proxy
    namespace: envoy-gateway-system
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: chat
  namespace: gateway
spec:
  gatewayClassName: chat
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: chat-gateway-tls
      allowedRoutes:
        namespaces:
          from: All
