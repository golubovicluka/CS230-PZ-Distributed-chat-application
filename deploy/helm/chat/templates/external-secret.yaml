apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: chat-redis
  labels:
    {{- include "chat.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.redisSecret.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.redisSecret.store }}
  target:
    name: chat-redis
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.redisSecret.key }}
        property: password
