apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatserver
  labels:
    {{- include "chat.labels" . | nindent 4 }}
    app.kubernetes.io/name: chatserver
spec:
  replicas: {{ .Values.chatserver.replicas }}
  selector:
    matchLabels:
      {{- include "chat.selector" "chatserver" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "chat.selector" "chatserver" | nindent 8 }}
    spec:
      serviceAccountName: chat
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        {{- include "chat.podSecurityContext" . | nindent 8 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "chat.selector" "chatserver" | nindent 14 }}
      containers:
        - name: chatserver
          image: {{ include "chat.image" .Values.chatserver.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: CHAT_SERVER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CHAT_LISTEN
              value: 0.0.0.0:8080
            - name: REGISTRY_URL
              value: ""
            - name: CHAT_DRAIN_DELAY
              value: {{ .Values.chatserver.drainDelay | quote }}
            - name: CHAT_ALLOWED_ORIGINS
              value: {{ .Values.chatserver.allowedOrigins | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: chat-db-app
                  key: uri
            - name: REDIS_ADDR
              value: redis:6379
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chat-redis
                  key: password
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
            failureThreshold: 1
          resources:
            {{- toYaml .Values.chatserver.resources | nindent 12 }}
          securityContext:
            {{- include "chat.containerSecurityContext" . | nindent 12 }}
            runAsUser: 65532
            runAsGroup: 65532
---
apiVersion: v1
kind: Service
metadata:
  name: chatserver
  labels:
    {{- include "chat.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "chat.selector" "chatserver" | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: chatserver
  labels:
    {{- include "chat.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "chat.selector" "chatserver" | nindent 6 }}
