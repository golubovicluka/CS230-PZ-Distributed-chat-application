# Single public origin for the Compose stack. It plays the role Envoy Gateway
# plays in Kubernetes: one host for the SPA, the load-balancer API, history and
# per-server WebSocket paths, so the browser never needs CORS or raw ports.

resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream web {
    zone web 64k;
    server web:8080 resolve;
}

upstream loadbalancer {
    zone loadbalancer 64k;
    server loadbalancer:9000 resolve;
}

upstream chatservers {
    zone chatservers 64k;
    server chatserver-1:8080 resolve;
    server chatserver-2:8080 resolve;
}

upstream chatserver_1 {
    zone chatserver_1 64k;
    server chatserver-1:8080 resolve;
}

upstream chatserver_2 {
    zone chatserver_2 64k;
    server chatserver-2:8080 resolve;
}

proxy_cache_path /tmp/nginx-cache levels=1:2 keys_zone=static:10m max_size=100m inactive=1h;

server {
    listen 8080;
    server_name _;

    # proxy_set_header is inherited only by locations that set none of their
    # own, so every header, including the WebSocket upgrade pair, lives here.
    # The original Host is kept so the chat servers' same-origin check works.
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok\n';
    }

    location /assets/ {
        proxy_cache static;
        proxy_cache_valid 200 1h;
        add_header X-Cache-Status $upstream_cache_status always;
        proxy_pass http://web;
    }

    location / {
        proxy_pass http://web;
    }

    location /lb/ {
        proxy_pass http://loadbalancer/;
    }

    location /api/ {
        proxy_next_upstream error timeout http_502 http_503;
        proxy_pass http://chatservers/;
    }

    location /cs/1/ {
        proxy_read_timeout 1h;
        proxy_pass http://chatserver_1/;
    }

    location /cs/2/ {
        proxy_read_timeout 1h;
        proxy_pass http://chatserver_2/;
    }
}
